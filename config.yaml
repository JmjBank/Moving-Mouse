application:
  name: "YouTube Teams Auto Switch"
  enabled: true

activity_monitor:
  enabled: true
  idle_threshold_seconds: 180
  poll_interval_seconds: 1

timing:
  teams_activation_delay_seconds: 2
  after_click_delay_seconds: 1
  startup_delay_seconds: 3
  youtube_activation_attempts: 2
  youtube_activation_retry_delay_seconds: 0.2
  youtube_activation_delay_seconds: 0.3
  youtube_restore_timeout_seconds: 6.0

windows:
  youtube:
    title_keywords:
      - "YouTube"
      - "YouTube - Google Chrome"
      - "Chrome"
    restore_minimize_teams: false

  teams:
    title_keywords:
      - "Microsoft Teams"
      - "Teams"

teams_click:
  x: 850
  y: 620
  button: "left"
  clicks: 1

youtube_cursor:
  enabled: true
  margin_pixels: 80
  wake_display_after_restore: false

logging:
  level: "INFO"
  log_to_console: true
  log_to_file: true
  file: "logs/app.log"
